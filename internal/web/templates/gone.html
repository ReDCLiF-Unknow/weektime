<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Link turned off · Weektime</title>
  {{template "assets"}}
  <meta name="robots" content="noindex, nofollow">
</head>
<body>
<div class="page page-center">
  <div class="container container-tight py-4">
    <div class="empty">
      <div class="empty-icon"><i class="ti ti-link-off fs-1"></i></div>
      <p class="empty-title">This link doesn't show anything</p>
      <p class="empty-subtitle text-secondary">
        Whoever sent it has turned it off, or it was copied incompletely.
        Ask them for a new one.
      </p>
      <div class="empty-action">
        <a href="/welcome" class="btn"><i class="ti ti-clock-hour-4 me-1"></i>Start a timesheet of your own</a>
      </div>
    </div>
  </div>
</div>
{{template "memory"}}
<script>
  // A link that shows nothing any more is no use remembering.
  (function () {
    var m = /^\/s\/([A-Za-z0-9_-]{16})/.exec(location.pathname);
    if (m) window.weektime.forgetShare(m[1]);
  })();
</script>
</body>
</html>
